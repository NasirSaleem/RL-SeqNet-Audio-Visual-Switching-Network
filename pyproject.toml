[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-msnet"
version = "0.1.0"
description = "Reliability-aware reinforcement-learning routing for audio-visual speech enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "PyYAML"]

[project.optional-dependencies]
experts = [
  "pytorch-lightning==1.8.0",
  "torchvision",
  "torchinfo",
  "decord==0.6.0",
  "opencv-python-headless",
  "soundfile",
  "pystoi",
  "pesq",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
